version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: video-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-platform

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: video-platform-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-platform

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: video-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-platform

  # LocalStack — S3 local para desenvolvimento
  localstack:
    image: localstack/localstack:latest
    container_name: video-platform-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - video-platform

  # Cria os buckets S3 no LocalStack após ele estar saudável
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: video-platform-localstack-init
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url=http://localstack:4566 s3 mb s3://${S3_UPLOADS_BUCKET}   --region ${AWS_REGION} || true
        aws --endpoint-url=http://localstack:4566 s3 mb s3://${S3_PROCESSED_BUCKET} --region ${AWS_REGION} || true
        echo "Buckets S3 criados com sucesso."
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - video-platform

  # Auth Service
  auth-service:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: video-platform-auth
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - video-platform
    restart: unless-stopped

  # API Gateway Service
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: video-platform-api-gateway
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth-service:8080
      STORAGE_SERVICE_URL: http://storage-service:8080
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    networks:
      - video-platform
    restart: unless-stopped

  # Processing Worker Service
  processing-worker:
    build:
      context: ..
      dockerfile: services/processing-worker/Dockerfile
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    networks:
      - video-platform
    restart: unless-stopped

  # Storage Service
  storage-service:
    build:
      context: ..
      dockerfile: services/storage/Dockerfile
    container_name: video-platform-storage
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    networks:
      - video-platform
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ..
      dockerfile: services/notification/Dockerfile
    container_name: video-platform-notification
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - video-platform
    restart: unless-stopped

  # React UI
  ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    container_name: video-platform-ui
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_AUTH_URL: ${VITE_AUTH_URL}
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - video-platform
    restart: unless-stopped

  # Cleanup Cron Job
  cleanup-cron:
    build:
      context: ..
      dockerfile: services/processing-worker/Dockerfile.cleanup
    container_name: video-platform-cleanup
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    networks:
      - video-platform
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: video-platform-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    networks:
      - video-platform
    restart: unless-stopped

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: video-platform-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_EMAIL=${GRAFANA_EMAIL}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-dashboard-system-overview.json:/etc/grafana/provisioning/dashboards/system-overview.json
      - ./grafana-dashboard-video-processing.json:/etc/grafana/provisioning/dashboards/video-processing.json
      - ./grafana-dashboard-database.json:/etc/grafana/provisioning/dashboards/database.json
      - ./grafana-dashboard-infrastructure.json:/etc/grafana/provisioning/dashboards/infrastructure.json
    depends_on:
      - prometheus
    networks:
      - video-platform
    restart: unless-stopped

  # Alertmanager - Alert routing and notification
  alertmanager:
    image: prom/alertmanager:latest
    container_name: video-platform-alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
    env_file:
      - .env
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/config.yml
      - alertmanager_data:/alertmanager
    networks:
      - video-platform
    restart: unless-stopped

  # PostgreSQL Exporter - Export PostgreSQL metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: video-platform-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - video-platform
    restart: unless-stopped

  # Redis Exporter - Export Redis metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: video-platform-redis-exporter
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - video-platform
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  localstack_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  video-platform:
    driver: bridge
